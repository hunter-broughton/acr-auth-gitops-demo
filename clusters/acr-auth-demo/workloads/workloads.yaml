apiVersion: apps/v1
kind: Deployment
metadata:
  name: nlp-model-trainer
  namespace: gitops-nlp-b
  labels:
    app.kubernetes.io/name: nlp-model-trainer
    demo.microsoft.com/scenario: private-acr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nlp-model-trainer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nlp-model-trainer
        demo.microsoft.com/scenario: private-acr
    spec:
      containers:
        - name: trainer
          image: acrnlptrainkgw7x.azurecr.io/model-trainer:v1
          imagePullPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-model-trainer
  namespace: gitops-vision-b
  labels:
    app.kubernetes.io/name: vision-model-trainer
    demo.microsoft.com/scenario: private-acr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vision-model-trainer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vision-model-trainer
        demo.microsoft.com/scenario: private-acr
    spec:
      containers:
        - name: trainer
          image: acrvisiontrainkgw7x.azurecr.io/model-trainer:v1
          imagePullPolicy: Always