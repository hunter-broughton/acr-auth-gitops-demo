apiVersion: apps/v1
kind: Deployment
metadata:
  name: nlp-batch-trainer
  namespace: gitops-nlp-b
  labels:
    app.kubernetes.io/name: nlp-batch-trainer
    demo.microsoft.com/scenario: private-acr
    demo.microsoft.com/tier: fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nlp-batch-trainer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nlp-batch-trainer
        demo.microsoft.com/scenario: private-acr
        demo.microsoft.com/tier: fleet
    spec:
      containers:
        - name: trainer
          image: acrnlptrainkgw7x.azurecr.io/model-trainer:v1
          imagePullPolicy: Always
          env:
            - name: DEMO_ROLE
              value: batch
---
